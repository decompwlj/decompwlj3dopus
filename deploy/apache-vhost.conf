# decompwlj 3D — Apache 2.4. Two ways to serve it; pick one.
#
# The site is HTML, ES modules, gzip data files and WebP images: no PHP, no CGI. Give its directory
# `AllowOverride All` (or at least FileInfo) so the .htaccess beside index.html is
# read; without it the site still works, only uncompressed and uncached.

# ── A. a subfolder of your existing site, e.g. https://decompwlj.com/3D/ ───
# Put the folder anywhere and add to the vhost that serves decompwlj.com:
#
#   Alias /3D /var/www/decompwlj-3d
#   <Directory /var/www/decompwlj-3d>
#       Options -Indexes +FollowSymLinks
#       AllowOverride All
#       Require all granted
#   </Directory>
#
# Every path in the page is relative, so any prefix works, and Apache redirects
# /3D to /3D/ by itself. Copying the folder under the existing DocumentRoot works
# too, as long as AllowOverride allows FileInfo there. If the parent site has a
# global PHP handler or a catch-all RewriteRule, keep it off this tree.

# ── B. its own virtual host, e.g. 3d.decompwlj.com ─────────────────────────
<VirtualHost *:80>
    ServerName   3d.decompwlj.com
    DocumentRoot /var/www/decompwlj-3d
    <Directory /var/www/decompwlj-3d>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    ErrorLog  ${APACHE_LOG_DIR}/decompwlj3d_error.log
    CustomLog ${APACHE_LOG_DIR}/decompwlj3d_access.log combined
</VirtualHost>

# ── modules ────────────────────────────────────────────────────────────────
#   Debian / Ubuntu:   sudo a2enmod deflate headers rewrite && sudo systemctl reload apache2
#   XAMPP / WAMP:      uncomment in httpd.conf
#                      LoadModule deflate_module modules/mod_deflate.so
#                      LoadModule headers_module modules/mod_headers.so
#                      LoadModule rewrite_module modules/mod_rewrite.so
