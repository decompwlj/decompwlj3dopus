# decompwlj 3D — nginx. Either inside the server block of decompwlj.com (A),
# or as its own server (B). Point the paths at the folder that holds index.html.

# ── A. a subfolder: https://decompwlj.com/3D/ ─────────────────────────────
#   location /3D/ {
#       alias /var/www/decompwlj-3d/;
#       index index.html;
#       autoindex off;
#   }
#   location = /3D { return 301 /3D/; }

# ── B. its own server ─────────────────────────────────────────────────────
server {
    listen 80;
    server_name  3d.decompwlj.com;
    root         /var/www/decompwlj-3d;
    index        index.html;
    autoindex    off;

    gzip            on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary       on;
    gzip_types      text/csv text/plain text/css text/javascript application/javascript image/svg+xml;
    gzip_static     on;          # serves data/**/*.csv.gz if you create them

    types { text/csv csv; text/javascript js; image/png png; text/html html; }

    location /data/   { add_header Cache-Control "public, max-age=604800"; }
    location /thumbs/ { add_header Cache-Control "public, max-age=604800"; }
    location = /data/catalog.csv { add_header Cache-Control "public, max-age=300"; }
    location = /index.html { add_header Cache-Control "no-cache"; }
}
